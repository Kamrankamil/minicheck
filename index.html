<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Buycex Presale</title>
    
    <!-- ✅ Mobile-friendly styles -->
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
    </style>

    <!-- ✅ Load SDK for MOBILE -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
      console.log('📱 Mobile Telegram SDK Initialization');
      console.log('User Agent:', navigator.userAgent);
      
      // ✅ Detect if we're on mobile
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      console.log('Is Mobile:', isMobile);
      
      (function() {
        let attempts = 0;
        const maxAttempts = 30; // More attempts for mobile
        
        function checkTelegram() {
          attempts++;
          console.log(`🔍 Attempt ${attempts}/${maxAttempts} - Checking Telegram...`);
          
          if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
            console.log('✅ Telegram WebApp found!');
            
            const tg = window.Telegram.WebApp;
            console.log('📊 Platform:', tg.platform);
            console.log('📊 Version:', tg.version);
            console.log('📊 InitData exists:', !!tg.initData);
            console.log('📊 InitDataUnsafe:', tg.initDataUnsafe);
            
            // ✅ Initialize WebApp
            try {
              tg.ready();
              console.log('✅ ready() called');
              
              tg.expand();
              console.log('✅ expand() called');
              
              // ✅ Disable vertical swipes on mobile
              if (isMobile && typeof tg.disableVerticalSwipes === 'function') {
                tg.disableVerticalSwipes();
                console.log('✅ Vertical swipes disabled');
              }
              
              // ✅ Set background color
              if (tg.setBackgroundColor) {
                tg.setBackgroundColor('#000000');
              }
              
              window.__TELEGRAM_SDK_READY__ = true;
              console.log('✅ SDK fully initialized');
              
            } catch (error) {
              console.error('❌ Error during initialization:', error);
              window.__TELEGRAM_SDK_READY__ = false;
              window.__TELEGRAM_SDK_ERROR__ = error.message;
            }
            
          } else if (attempts < maxAttempts) {
            console.log('⏳ SDK not ready, waiting...');
            setTimeout(checkTelegram, 300); // Check every 300ms
          } else {
            console.error('❌ Telegram SDK failed to load after', maxAttempts, 'attempts');
            console.log('window.Telegram:', window.Telegram);
            console.log('typeof Telegram:', typeof window.Telegram);
            window.__TELEGRAM_SDK_READY__ = false;
            window.__TELEGRAM_SDK_ERROR__ = 'Timeout - SDK not loaded';
          }
        }
        
        // ✅ Start checking immediately
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM loaded, starting checks in 500ms');
            setTimeout(checkTelegram, 500);
          });
        } else {
          console.log('📄 DOM already loaded, starting checks in 500ms');
          setTimeout(checkTelegram, 500);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
