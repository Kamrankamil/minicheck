<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    
    <!-- ✅ Prevent caching on mobile -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>BCX Token Presale - Early Access</title>

    <meta content="Buycex" property="og:title" />
    <meta content="https://global.buycex.com/Upload/coin/677da3cd24a43.png" property="og:image" />
    <meta property="og:type" content="website" />
    <meta content="summary_large_image" name="twitter:card" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- ✅ Force reload Telegram SDK with timestamp -->
    <script src="https://telegram.org/js/telegram-web-app.js?v=7.0"></script>
    
    <!-- ✅ Initialize immediately with better mobile support -->
    <script>
      (function() {
        console.log('🔍 [Mobile] Checking Telegram SDK...');
        console.log('User Agent:', navigator.userAgent);
        
        let attempts = 0;
        const maxAttempts = 20;
        
        function initTelegram() {
          const tg = window.Telegram?.WebApp;
          
          if (tg) {
            console.log('✅ [Mobile] Telegram SDK loaded!');
            console.log('Platform:', tg.platform);
            console.log('Version:', tg.version);
            console.log('User:', tg.initDataUnsafe?.user);
            
            tg.ready();
            tg.expand();
            tg.disableVerticalSwipes?.();
            
            // Set theme
            document.body.style.backgroundColor = tg.themeParams.bg_color || '#000000';
            
            window.__TELEGRAM_SDK_READY__ = true;
            return;
          }
          
          attempts++;
          console.log(`⏳ [Mobile] Attempt ${attempts}/${maxAttempts}...`);
          
          if (attempts < maxAttempts) {
            setTimeout(initTelegram, 200);
          } else {
            console.error('❌ [Mobile] Telegram SDK not loaded');
            window.__TELEGRAM_SDK_READY__ = false;
            window.__TELEGRAM_SDK_ERROR__ = 'SDK not loaded after ' + maxAttempts + ' attempts';
          }
        }
        
        // Start checking
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => setTimeout(initTelegram, 100));
        } else {
          setTimeout(initTelegram, 100);
        }
      })();
    </script>
    
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        background-color: #000000;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
