<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    
    <!-- Viewport for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-touch-fullscreen" content="yes" />
    
    <!-- ✅ Content Security Policy for Telegram Mini Apps -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' https://telegram.org https://*.vercel.app https://*.ngrok-free.dev; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org https://telegram.org/js/telegram-web-app.js; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com data:; 
                   img-src 'self' data: https: blob:; 
                   connect-src 'self' https://*.vercel.app https://*.ngrok-free.dev https://isochronous-packable-sherly.ngrok-free.dev wss: https:; 
                   frame-src 'self' https://telegram.org https://*.telegram.org;">
    
    <title>BCX Token Presale - Early Access to the Ownership Economy</title>

    <!-- Open Graph -->
    <meta content="Buycex" property="og:title" />
    <meta content="BCX Token Presale - Early Access to the Ownership Economy" property="og:description" />
    <meta content="https://global.buycex.com/Upload/coin/677da3cd24a43.png" property="og:image" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://minicheck.vercel.app" />

    <!-- Twitter Card -->
    <meta content="Buycex" property="twitter:title" />
    <meta content="BCX Token Presale - Early Access to the Ownership Economy" property="twitter:description" />
    <meta content="https://global.buycex.com/Upload/coin/677da3cd24a43.png" property="twitter:image" />
    <meta content="summary_large_image" name="twitter:card" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://telegram.org" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- ✅ Telegram Web App SDK - Load BEFORE React -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    
    <!-- ✅ Telegram SDK Loader with Fallback -->
    <script>
      // Ensure Telegram SDK is loaded
      (function() {
        let attempts = 0;
        const maxAttempts = 20;
        
        function checkTelegramSDK() {
          if (window.Telegram?.WebApp) {
            console.log('✅ Telegram SDK loaded successfully');
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            window.__TELEGRAM_SDK_READY__ = true;
            return;
          }
          
          attempts++;
          if (attempts < maxAttempts) {
            setTimeout(checkTelegramSDK, 200);
          } else {
            console.warn('⚠️ Telegram SDK not loaded after', maxAttempts, 'attempts');
            window.__TELEGRAM_SDK_READY__ = false;
          }
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkTelegramSDK);
        } else {
          checkTelegramSDK();
        }
      })();
    </script>
    
    <!-- ✅ Prevent zoom on iOS -->
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        -webkit-overflow-scrolling: touch;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
