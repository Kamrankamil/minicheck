<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Buycex Presale</title>
    
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
      }
    </style>

    <!-- ✅ Load Telegram Web App SDK FIRST -->
    <script>
      console.log('🔧 Starting Telegram SDK initialization...');
      
      // ✅ Create script element
      const script = document.createElement('script');
      script.src = 'https://telegram.org/js/telegram-web-app.js';
      script.async = false; // Load synchronously
      
      script.onload = function() {
        console.log('✅ Telegram SDK script loaded');
        
        // Wait a bit for SDK to initialize
        setTimeout(() => {
          if (window.Telegram && window.Telegram.WebApp) {
            console.log('✅ Telegram WebApp available');
            console.log('Platform:', window.Telegram.WebApp.platform);
            console.log('Version:', window.Telegram.WebApp.version);
            window.__TELEGRAM_SDK_READY__ = true;
            
            // Initialize WebApp
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            
            // Disable vertical swipes if available
            if (window.Telegram.WebApp.disableVerticalSwipes) {
              window.Telegram.WebApp.disableVerticalSwipes();
            }
          } else {
            console.error('❌ Telegram WebApp object not found after script load');
            window.__TELEGRAM_SDK_READY__ = false;
            window.__TELEGRAM_SDK_ERROR__ = 'WebApp object not available';
          }
        }, 100);
      };
      
      script.onerror = function() {
        console.error('❌ Failed to load Telegram SDK script');
        window.__TELEGRAM_SDK_READY__ = false;
        window.__TELEGRAM_SDK_ERROR__ = 'Script failed to load';
      };
      
      // Add script to head
      document.head.appendChild(script);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
